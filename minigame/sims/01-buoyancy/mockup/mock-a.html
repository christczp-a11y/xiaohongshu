<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
@font-face{font-family:NS;src:url(package/files/noto-sans-sc-chinese-simplified-400-normal.woff2);font-weight:400}
@font-face{font-family:NS;src:url(package/files/noto-sans-sc-chinese-simplified-500-normal.woff2);font-weight:500}
@font-face{font-family:NS;src:url(package/files/noto-sans-sc-chinese-simplified-700-normal.woff2);font-weight:700}
@font-face{font-family:IN;src:url(inter/package/files/inter-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IN;src:url(inter/package/files/inter-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:IN;src:url(inter/package/files/inter-latin-700-normal.woff2);font-weight:700}
:root{--ink:#14233a;--sub:#5b6b82;--cyan:#1aa6e8;--amber:#f08a24;--glass:rgba(255,255,255,.58);--edge:rgba(255,255,255,.85)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:IN,NS,sans-serif;color:var(--ink);
 background:radial-gradient(120% 70% at 20% 0%,#f7fbff 0%,#e6eef7 45%,#d6e1ee 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
.top{position:absolute;top:50px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between}
.title{font-family:NS;font-weight:700;font-size:24px;letter-spacing:.5px}
.title small{display:block;font-family:IN;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:2px;margin-top:2px}
.icon{width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--edge);
 box-shadow:0 6px 18px rgba(30,60,100,.10);display:grid;place-items:center;font-weight:600;color:var(--sub);backdrop-filter:blur(12px)}
.tabs{position:absolute;top:112px;left:20px;right:20px;height:44px;border-radius:14px;padding:4px;display:flex;
 background:rgba(255,255,255,.45);border:1px solid var(--edge);box-shadow:inset 0 1px 0 #fff,0 8px 20px rgba(30,60,100,.08)}
.tabs div{flex:1;display:grid;place-items:center;font-family:NS;font-size:14px;font-weight:500;color:var(--sub);border-radius:10px}
.tabs .on{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(30,60,100,.14)}
svg.stage{position:absolute;top:166px;left:0}
.chips{position:absolute;top:178px;right:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.chip{font-family:NS;font-size:12px;font-weight:500;padding:6px 10px;border-radius:999px;background:var(--glass);
 border:1px solid var(--edge);box-shadow:0 4px 12px rgba(30,60,100,.08);backdrop-filter:blur(10px);color:var(--ink)}
.chip b{color:var(--sub);font-weight:400;margin-right:4px}
.sw{display:inline-block;width:26px;height:15px;border-radius:9px;background:var(--cyan);vertical-align:-3px;margin-left:6px;position:relative}
.sw:after{content:"";position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff}
.panel{position:absolute;left:16px;right:16px;border-radius:22px;background:var(--glass);border:1px solid var(--edge);
 box-shadow:inset 0 1px 0 #fff,0 14px 34px rgba(30,60,100,.13);backdrop-filter:blur(16px)}
.read{top:560px;height:166px;padding:14px 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.k{font-family:NS;font-size:12px;color:var(--sub)}
.v{font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.v i{font-style:normal;font-size:13px;color:var(--sub);font-weight:500;margin-left:3px}
.v.c{color:var(--cyan)} .v.a{color:var(--amber)}
.eqrow{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:NS;font-size:13px;font-weight:500;
 padding:8px;border-radius:12px;background:linear-gradient(90deg,rgba(26,166,232,.10),rgba(26,166,232,.20),rgba(26,166,232,.10))}
.eqrow .eq{width:24px;height:24px;border-radius:50%;background:var(--cyan);color:#fff;display:grid;place-items:center;font-family:IN;font-weight:700;
 box-shadow:0 0 0 4px rgba(26,166,232,.18),0 0 16px rgba(26,166,232,.7)}
.chal{top:736px;height:94px;padding:12px 16px}
.chal .h{font-family:NS;font-size:11px;font-weight:700;color:var(--amber);letter-spacing:1px}
.chal .q{font-family:NS;font-size:15px;font-weight:500;margin:4px 0 9px}
.opts{display:flex;gap:8px}
.opts div{flex:1;text-align:center;font-family:NS;font-size:14px;font-weight:500;padding:7px 0;border-radius:11px;background:#fff;
 border:1px solid rgba(20,35,58,.08);box-shadow:0 3px 8px rgba(30,60,100,.07)}
</style></head><body>
