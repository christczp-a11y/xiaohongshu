  <div class="meter"><span class="k">山坡上的水</span><b id="nSoil">0</b><div class="bar"><i id="mSoil"></i></div></div>
</aside>

<div id="hint" class="block dark">拖动<b>云朵</b>换地方 · <b>按住</b>云朵能挤出雨</div>

<section id="panel" class="card">
  <div id="chips">
    <button class="chip block" data-k="evap"><em>1</em>蒸发</button>
    <button class="chip block" data-k="cond"><em>2</em>凝结</button>
    <button class="chip block" data-k="rain"><em>3</em>降水</button>
    <button class="chip block" data-k="flow"><em>4</em>汇流</button>
  </div>
  <div id="explain">
    <span id="stageNo" class="display">↻</span>
    <p id="explainText">太阳、云、雨和小河，让水一直在转圈。试试拖动下面的<b>太阳时间</b>，或者拖动天上的<b>云朵</b>。</p>
  </div>
  <div id="controls">
    <label for="time">太阳</label>
    <input id="time" type="range" min="4" max="20" step="0.05" value="10.5" />
    <span id="clock">10:30</span>
    <button id="play" class="block dark">▶ 播放</button>
    <button id="reset" class="block">重来</button>
  </div>
  <div id="note">真实的水蒸气是看不见的，这里画成白点方便观察。AI 辅助开发。</div>
</section>

</body>
</html>
